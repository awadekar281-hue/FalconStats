services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: falconstats
      POSTGRES_USER: falconstats
      POSTGRES_PASSWORD: falconstats
    ports: ["5432:5432"]
    volumes: ["falconstats-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falconstats -d falconstats"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["falconstats-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  falconstats-postgres:
  falconstats-redis:
